# The AWS Load Balancer Controller sends traffic from outside the cluster
# straight to pod IPs; from the pod's perspective the source is the ALB's
# ENIs, not any cluster namespace. Allow ingress from all namespaces to the
# UI pod on port 8080 so the ALB can reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-external-to-ui
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ui
  policyTypes:
    - Ingress
  ingress:
    - from: []   # anywhere
      ports:
        - protocol: TCP
          port: 8080
