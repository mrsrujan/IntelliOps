# UI → order-service, UI → payment-service, and any future intra-namespace
# calls. Broadly permissive within the namespace, strict at the boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Values.namespace }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}   # any pod in the same namespace
  egress:
    - to:
        - podSelector: {}
