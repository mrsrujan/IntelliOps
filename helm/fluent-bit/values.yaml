fluent-bit:

  kind: DaemonSet

  serviceAccount:
    create: true
    name: fluent-bit
    # role ARN is injected by the ArgoCD Application via helm parameters
    # (see k8s/argocd/apps/fluent-bit.yaml)
    annotations: {}

  tolerations:
    - operator: Exists
      effect: NoSchedule

  # Ship container logs to CloudWatch Logs
  config:
    service: |
      [SERVICE]
        Daemon        Off
        Flush         5
        Log_Level     info
        Parsers_File  /fluent-bit/etc/parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020

    inputs: |
      [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        Parser            cri
        Tag               kube.*
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    filters: |
      [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off

      # Only ship logs from application namespaces; drop the noisy system ones
      [FILTER]
        Name    grep
        Match   kube.*
        Regex   $kubernetes['namespace_name'] ^(apps-dev|argocd|monitoring)$

    outputs: |
      [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.*
        region              us-east-1
        log_group_name      /eks/intelliops-dev/apps
        log_stream_prefix   from-fluentbit-
        log_stream_template $kubernetes['namespace_name'].$kubernetes['pod_name']
        auto_create_group   false
