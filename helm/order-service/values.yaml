replicaCount: 2

image:
  repository: "573978149165.dkr.ecr.us-east-1.amazonaws.com/intelliops/order-service"
  tag: 5922f3a5858da337a0cf4bb02ea797572cca8b92
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /ready
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/metrics"

# Extra environment variables — merged into the container env list
# NOTE: fault injection is enabled here for demo purposes; disable in real production.
env:
  ENABLE_FAULT_INJECTION: "true"

canary:
  steps:
    - setWeight: 20
    - pause:
        duration: 2m
    - setWeight: 50
    - pause:
        duration: 2m
    - setWeight: 100
