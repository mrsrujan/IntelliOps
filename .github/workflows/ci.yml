name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  PROJECT: intelliops

jobs:

  # ── 1. HARD GATE — blocks every downstream job on any secret detection ────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — detect hardcoded secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. SOFT GATE — IaC config scan, runs in parallel with ci ─────────────────
  iac-scan:
    name: IaC Config Scan (Trivy)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy config scan — Helm charts
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: helm/
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM

      - name: Trivy config scan — Terraform
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: infra/
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH,MEDIUM

  # ── 3. BUILD · SOURCE SCANS (soft) · CONTAINER SCAN (hard) · PUSH ────────────
  ci:
    name: Build, Scan, Push
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      id-token: write
      contents: write

    strategy:
      # Serialise so parallel matrix jobs don't race on git push
      max-parallel: 1
      matrix:
        service: [payment-service, order-service, ui]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: tag
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Run unit tests
        working-directory: k8s/apps/${{ matrix.service }}
        run: |
          if [ -f "Makefile" ]; then make test; fi

      # ── SOFT GATE: pip-audit — findings shown in log, pipeline continues ─────
      - name: pip-audit — dependency CVE scan
        working-directory: k8s/apps/${{ matrix.service }}
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      # ── SOFT GATE: Bandit — findings shown in log, pipeline continues ─────────
      - name: Bandit — Python SAST
        working-directory: k8s/apps/${{ matrix.service }}
        continue-on-error: true
        run: |
          pip install bandit
          bandit -r . -ll

      # ── BUILD ────────────────────────────────────────────────────────────────
      - name: Build Docker image
        run: |
          docker build \
            -t $ECR_REGISTRY/$PROJECT/${{ matrix.service }}:${{ steps.tag.outputs.IMAGE_TAG }} \
            -t $ECR_REGISTRY/$PROJECT/${{ matrix.service }}:latest \
            k8s/apps/${{ matrix.service }}

      # ── HARD GATE: Trivy container scan — CRITICAL CVE blocks the pipeline ───
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.PROJECT }}/${{ matrix.service }}:${{ steps.tag.outputs.IMAGE_TAG }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Push to ECR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push $ECR_REGISTRY/$PROJECT/${{ matrix.service }}:${{ steps.tag.outputs.IMAGE_TAG }}
          docker push $ECR_REGISTRY/$PROJECT/${{ matrix.service }}:latest

      - name: Update Helm values and commit
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i "s|repository:.*|repository: \"$ECR_REGISTRY/$PROJECT/${{ matrix.service }}\"|" \
            helm/${{ matrix.service }}/values.yaml
          sed -i "s|tag:.*|tag: ${{ steps.tag.outputs.IMAGE_TAG }}|" \
            helm/${{ matrix.service }}/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add helm/${{ matrix.service }}/values.yaml
          if git diff --cached --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -m "ci: update ${{ matrix.service }} image to ${{ steps.tag.outputs.IMAGE_TAG }}"
          git pull --rebase --autostash origin main
          git push

  # ── 4. HELM LINT ──────────────────────────────────────────────────────────────
  helm-lint:
    name: Helm Lint
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint charts
        run: |
          for chart in payment-service order-service ui; do
            helm lint helm/$chart
            helm template $chart helm/$chart --debug > /dev/null
          done
